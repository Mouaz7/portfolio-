name: Sync GitHub projects

# The daily schedule stays paused until one complete manual run is green in
# the deployed environment. Keep workflow_dispatch available for that gate.
on:
  workflow_dispatch:

concurrency:
  group: sync-github-projects
  cancel-in-progress: false

jobs:
  sync-projects:
    name: Synchronize project records
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Validate configuration and synchronize projects
        env:
          CANONICAL_SITE_URL: ${{ vars.CANONICAL_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          missing=0
          for name in CANONICAL_SITE_URL SUPABASE_SECRET_KEY SUPABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing configuration::$name is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0
          npm run sync:projects

  revalidate-projects:
    name: Revalidate project data
    needs: sync-projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Validate configuration and revalidate
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ vars.CANONICAL_SITE_URL }}
        run: |
          missing=0
          for name in REVALIDATE_SECRET REVALIDATE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing configuration::$name is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0
          curl --fail --silent --show-error \
            --request POST "$REVALIDATE_URL/api/internal/revalidate" \
            --header "Authorization: Bearer $REVALIDATE_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"tags":["projects"]}'
